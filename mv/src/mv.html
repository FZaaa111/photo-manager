<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开心往前飞 MV</title>
<style>
@font-face{font-family:KL;src:url(data:font/woff2;base64,/*FONT*/) format('woff2');font-display:block}
:root{--bg:#05060f;--fg:#fff;--accent:#ffd166}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:KL,system-ui,sans-serif;color:var(--fg)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;background:#000}
#cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,rgba(5,6,20,.25),rgba(5,6,20,.75));cursor:pointer;transition:opacity .5s}
#cover.hide{opacity:0;pointer-events:none}
#cover button{font-family:KL,sans-serif;font-size:clamp(20px,3.2vw,34px);padding:.55em 1.4em;border:none;border-radius:999px;color:#3a1b4f;background:linear-gradient(135deg,#ffe066,#ff9f6b);box-shadow:0 10px 40px rgba(255,160,90,.45);cursor:pointer}
#cover p{margin:0;font-size:clamp(12px,1.6vw,16px);opacity:.75;letter-spacing:.2em}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.6));transition:opacity .4s}
#bar.idle{opacity:0}
#bar button{font-family:inherit;background:none;border:none;color:#fff;font-size:20px;width:36px;cursor:pointer}
#seek{flex:1;accent-color:var(--accent)}
#time{font-size:13px;font-variant-numeric:tabular-nums;opacity:.85;min-width:92px;text-align:right}
body.render #cover,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="cover"><button id="playBtn">▶ 播放 MV</button><p>开心往前飞 · 动画 MV</p></div>
<div id="bar" class="idle"><button id="pp">❚❚</button><input id="seek" type="range" min="0" max="77" step="0.01" value="0"><span id="time">0:00 / 1:17</span></div>
<script>
'use strict';
const FEAT=/*FEAT*/;
const AUDIO_SRC='data:audio/mp4;base64,/*AUDIO*/';
const DURATION=77.0;
const W=1920,H=1080,TAU=Math.PI*2;

/* ---------- lyrics: [start, sung-end, text] (timed from the vocal track) ---------- */
const LYRICS=[
[6.50,8.00,'我唤醒大海'],[8.50,9.75,'唤醒山脉'],[9.92,11.45,'我唤醒沙漠'],[11.62,12.95,'处处充满色彩'],
[13.00,14.20,'美丽的地方'],[16.30,17.40,'开心往前飞'],[19.40,21.30,'就算有亿万公里'],[21.70,23.00,'一吨行李'],
[23.10,24.60,'我们不放弃'],[24.90,26.20,'前进需要勇气'],[26.30,27.40,'一直往前飞'],[29.30,31.20,'最重要开心就好'],
[31.60,33.10,'忘记烦恼'],[33.50,34.70,'宇宙很大'],[34.95,35.90,'任飞翔'],[36.70,37.90,'满载欢乐'],
[38.40,39.20,'回航'],[39.95,40.80,'闯一闯'],[41.00,42.50,'让我们闯一闯'],[43.15,45.20,'我们志气要比天还高'],
[45.85,46.50,'云啊'],[46.70,48.00,'轻轻飘过来'],[48.15,51.50,'梦中轮廓一点点透露出来'],[52.20,53.40,'飞吧飞吧'],
[54.40,56.40,'飞过黎明和夜晚'],[56.90,58.70,'啦啦啦'],[58.95,59.70,'风啊'],[60.00,61.15,'轻轻吹过来'],
[61.30,64.80,'梦想翅膀流星天空中划过'],[65.60,66.40,'穿越时空'],[67.45,69.80,'回到这梦想的地方']
];

/* ---------- math helpers ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const bump=(a,b,c,d,x)=>Math.min(inv(a,b,x),1-inv(c,d,x));
const E={
  inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  out:k=>1-Math.pow(1-k,3), in:k=>k*k*k, sine:k=>-(Math.cos(Math.PI*k)-1)/2,
  back:k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)},
  elastic:k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*TAU/3)+1
};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const hexc={};
function rgb(h){if(hexc[h])return hexc[h];const n=parseInt(h.slice(1),16);return hexc[h]=[n>>16&255,n>>8&255,n&255]}
function mixc(a,b,k){const A=rgb(a),B=rgb(b);return `rgb(${A[0]+(B[0]-A[0])*k|0},${A[1]+(B[1]-A[1])*k|0},${A[2]+(B[2]-A[2])*k|0})`}
function mixh(a,b,k){const A=rgb(a),B=rgb(b);const f=i=>Math.round(A[i]+(B[i]-A[i])*k).toString(16).padStart(2,'0');return '#'+f(0)+f(1)+f(2)}
/* desaturate-to-gray "asleep" colour, w=1 means fully awake */
function wk(h,w){const A=rgb(h);const g=(A[0]*.3+A[1]*.59+A[2]*.11)*.62;return `rgb(${g+(A[0]-g)*w|0},${g+(A[1]-g)*w|0},${g+(A[2]-g)*w|0})`}
function rgba(h,a){const A=rgb(h);return `rgba(${A[0]},${A[1]},${A[2]},${a})`}
function track(keys,t,ease=E.inOut){ // keys: [[t,v],...]
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const a=keys[i-1],b=keys[i];return lerp(a[1],b[1],ease(inv(a[0],b[0],t)))}}
  return keys[keys.length-1][1];
}

/* ---------- audio features ---------- */
const BEATS=FEAT.beats;
function lastBeat(t){let lo=0,hi=BEATS.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(BEATS[m]<=t){r=m;lo=m+1}else hi=m-1}return r}
function pulse(t,k=7){const i=lastBeat(t);return i<0?0:Math.exp(-(t-BEATS[i])*k)}
function amp(t){return FEAT.rms[Math.min(FEAT.rms.length-1,Math.max(0,Math.floor(t*30)))]||0}

/* ---------- sky ---------- */
const SKY=[
[0,'#070b22','#121a45','#1e2458'],[6.3,'#0b1233','#1c2556','#2e3368'],[8.5,'#283a86','#6d5fb5','#f0a39a'],
[11.0,'#3a78d4','#86bdf0','#ffd9ab'],[13.5,'#3f8fe8','#8fd0ff','#fff0cf'],[18,'#3f93ec','#94d3ff','#e9f8ff'],
[22.8,'#4a92e0','#9ad0f5','#e6f4ff'],[23.6,'#3c4b66','#6c7c94','#a3adbb'],[26.0,'#3c4b66','#6c7c94','#a3adbb'],
[26.6,'#2c8cf0','#7fcaff','#fff3c4'],[28.8,'#2c8cf0','#7fcaff','#fff3c4'],[30.0,'#ff7eb0','#ffad8c','#ffe3a3'],
[32.5,'#7a5cd6','#ff92ad','#ffcf9c'],[34.2,'#090a24','#17124a','#2a1858'],[45.4,'#090a24','#17124a','#2a1858'],
[45.8,'#a99bff','#ffc2dd','#ffe8d4'],[51.5,'#9fb5ff','#ffd0e4','#fff0dc'],[52.6,'#47a8ff','#a6dbff','#fff3d1'],
[54.6,'#4d8fe6','#ffb3a0','#ffd89c'],[56.0,'#3a2b7c','#ff7a8f','#ffbf7a'],[57.4,'#0d1240','#25206b','#4a2f82'],
[65.3,'#070a26','#161a50','#2d2470'],[67.3,'#ff8f6b','#ffc48b','#fff1c6'],[71,'#ff8f8f','#ffbd8f','#ffe6b8'],
[77,'#5a44b0','#ff8aa6','#ffd09c']];
function skyAt(t){
  if(t<=SKY[0][0])return SKY[0].slice(1);
  for(let i=1;i<SKY.length;i++)if(t<=SKY[i][0]){const a=SKY[i-1],b=SKY[i],k=E.sine(inv(a[0],b[0],t));return [mixh(a[1],b[1],k),mixh(a[2],b[2],k),mixh(a[3],b[3],k)]}
  return SKY[SKY.length-1].slice(1);
}
function drawSky(c,t,cols){
  const s=cols||skyAt(t);const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,s[0]);g.addColorStop(.55,s[1]);g.addColorStop(1,s[2]);c.fillStyle=g;c.fillRect(0,0,W,H);
}
function stars(c,t,n,alpha,seed=1,area){
  if(alpha<=0)return;const [ax,ay,aw,ah]=area||[0,0,W,H*.75];
  for(let i=0;i<n;i++){
    const x=ax+rnd(i*3+seed)*aw,y=ay+rnd(i*7+seed*3)*ah,r=.6+rnd(i*11+seed)*2.2;
    const tw=.55+.45*Math.sin(t*(1.5+rnd(i+seed)*3)+i);
    c.globalAlpha=alpha*tw*(.5+.5*rnd(i*5));c.fillStyle='#fff';
    if(r>2.3){starShape(c,x,y,r*2.4,r*.7);}else{c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
  }
  c.globalAlpha=1;
}
function starShape(c,x,y,R,r,pts=4,rot=0){
  c.beginPath();for(let i=0;i<pts*2;i++){const a=rot+i*Math.PI/pts-Math.PI/2,rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill();
}
function glow(c,x,y,r,col,a=1){
  const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));
  c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
}

/* ---------- clouds ---------- */
const cloudCache={};
function cloudPath(seed){
  if(cloudCache[seed])return cloudCache[seed];
  const p=new Path2D();const n=4+Math.floor(rnd(seed)*3);
  for(let i=0;i<n;i++){const x=-.36+.72*i/(n-1)+(rnd(seed+i*3)-.5)*.06;const r=.12+rnd(seed*7+i)*.1+(1-Math.abs(x)*2.2)*.07;
    p.moveTo(x+r,-r*.55);p.arc(x,-r*.55,r,0,TAU);}
  p.roundRect(-.46,-.16,.92,.16,.08);
  return cloudCache[seed]=p;
}
function cloud(c,x,y,w,top,bot,a=1,seed=1){
  if(a<=0||x<-w||x>W+w)return;c.save();c.globalAlpha*=a;c.translate(x,y);c.scale(w,w);
  const g=c.createLinearGradient(0,-.4,0,0);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fill(cloudPath(seed));c.restore();
}

/* ---------- sticker / kinetic text ---------- */
function sticker(c,str,x,y,size,o={}){
  const sc=o.scale??1;if(sc<=0.001||(o.alpha??1)<=0)return;
  c.save();c.globalAlpha*=o.alpha??1;c.translate(x,y);c.rotate(o.rot||0);c.scale(sc,sc);
  c.font=`${size}px KL`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  const sh=o.shadow||'rgba(40,10,70,.55)';
  c.lineWidth=size*.2;c.strokeStyle=sh;c.strokeText(str,size*.03,size*.09);
  c.strokeStyle=o.stroke||'#3b1d5e';c.strokeText(str,0,0);
  c.fillStyle=o.fill||'#fff';c.fillText(str,0,0);c.restore();
}
function popWord(c,t,chars,x,y,size,times,tOut,o={}){
  const gap=size*(o.gap??1.02);const n=chars.length;
  const out=tOut?E.in(inv(tOut,tOut+.35,t)):0;if(out>=1)return;
  for(let i=0;i<n;i++){
    const ti=times[i];if(t<ti)continue;const k=inv(ti,ti+.35,t);
    const px=o.vertical?x:x+(i-(n-1)/2)*gap,py=o.vertical?y+(i-(n-1)/2)*gap:y;
    const wob=Math.sin((t-ti)*6+i)*.04*(o.wobble??1);
    sticker(c,chars[i],px,py-(o.bounce?18*pulse(t):0),size,{fill:Array.isArray(o.fill)?o.fill[i%o.fill.length]:o.fill,stroke:o.stroke,
      scale:E.back(k)*(1-out*.4)*(1+.06*pulse(t)*(o.beat??0)),rot:(o.rot||0)+wob,alpha:k*(1-out)});
  }
}

/* ---------- landscape (opening + finale) ---------- */
const HZ=650;
const MOUNT=[[-560,360,360],[-200,300,390],[150,250,420],[560,360,330],[900,200,450],[1300,320,360],[1700,230,430],[2150,340,380],[2500,290,400]];
const MOUNT2=[[-400,420,300],[350,380,320],[1100,400,300],[1900,390,330],[2700,410,300]];
function duneY(x,l){const D=[[1150,550,1650,520],[1200,480,2050,450],[1250,400,1450,380]][l];return D[0]-D[1]*Math.exp(-Math.pow((x-D[2])/D[3],2))}
function drawPeak(c,x,py,bw,grow,light,dark,snow){
  const base=HZ+4;const top=base-(base-py)*grow;if(grow<=0)return;
  c.fillStyle=light;c.beginPath();c.moveTo(x-bw,base);c.lineTo(x,top);c.lineTo(x,base);c.fill();
  c.fillStyle=dark;c.beginPath();c.moveTo(x,top);c.lineTo(x+bw,base);c.lineTo(x,base);c.fill();
  if(snow){const h=(base-top)*.24,k=h/(base-top);c.fillStyle=snow;c.beginPath();c.moveTo(x,top);
    c.lineTo(x+bw*k,top+h);c.lineTo(x+bw*k*.4,top+h*.75);c.lineTo(x,top+h*.95);c.lineTo(x-bw*k*.4,top+h*.72);c.lineTo(x-bw*k,top+h);c.closePath();c.fill();}
}
function drawBalloon(c,x,y,s,cols,t){
  c.save();c.translate(x,y);c.scale(s,s);c.rotate(Math.sin(t*1.3+x)*.05);
  c.strokeStyle='rgba(80,50,30,.8)';c.lineWidth=2;c.beginPath();c.moveTo(-18,40);c.lineTo(-10,78);c.moveTo(18,40);c.lineTo(10,78);c.stroke();
  c.fillStyle='#9a6a3c';c.fillRect(-12,76,24,18);
  for(let i=0;i<4;i++){c.fillStyle=cols[i%cols.length];c.beginPath();c.ellipse(-30+i*20+10,0,10+ (i==1||i==2?3:0),52,0,0,TAU);c.fill()}
  c.globalAlpha*=.25;c.fillStyle='#fff';c.beginPath();c.ellipse(-14,-18,8,22,-.3,0,TAU);c.fill();c.restore();
}
function drawFlower(c,x,y,s,col,t,i){
  if(s<=0)return;c.save();c.translate(x,y);c.scale(s,s);c.rotate(Math.sin(t*2+i)*.12);
  c.strokeStyle='#3d9b5a';c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(4,-14,0,-26);c.stroke();
  c.translate(0,-28);c.rotate(t*.6+i);c.fillStyle=col;
  for(let k=0;k<5;k++){c.rotate(TAU/5);c.beginPath();c.ellipse(0,-8,5.5,9,0,0,TAU);c.fill()}
  c.fillStyle='#ffd166';c.beginPath();c.arc(0,0,5,0,TAU);c.fill();c.restore();
}
function drawPalm(c,x,y,s,t){
  if(s<=0)return;c.save();c.translate(x,y);c.scale(s,s);
  c.strokeStyle='#8a5a33';c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-70,10,-150);c.stroke();
  c.translate(10,-150);c.fillStyle='#2fb36d';
  for(let k=0;k<6;k++){c.save();c.rotate(-Math.PI/2+(k-2.5)*.55+Math.sin(t*1.6+k)*.06);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(45,-22,95,12);c.quadraticCurveTo(45,0,0,8);c.fill();c.restore()}
  c.fillStyle='#7a4a2a';c.beginPath();c.arc(-6,6,8,0,TAU);c.arc(8,8,8,0,TAU);c.fill();c.restore();
}
function drawCactus(c,x,y,s){
  if(s<=0)return;c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#3fae6a';
  c.beginPath();c.roundRect(-11,-90,22,90,11);c.roundRect(-38,-62,14,34,7);c.roundRect(24,-74,14,40,7);c.roundRect(-38,-36,30,12,6);c.roundRect(10,-44,28,12,6);c.fill();
  c.fillStyle='#ff6fa3';c.beginPath();c.arc(0,-92,7,0,TAU);c.fill();c.restore();
}
function drawBoat(c,x,y,s,t){
  c.save();c.translate(x,y+Math.sin(t*2)*4);c.rotate(Math.sin(t*1.7)*.05);c.scale(s,s);
  c.fillStyle='#ff6b6b';c.beginPath();c.moveTo(-60,0);c.lineTo(60,0);c.lineTo(42,22);c.lineTo(-44,22);c.fill();
  c.fillStyle='#fff';c.beginPath();c.moveTo(-4,-8);c.lineTo(-4,-110);c.lineTo(48,-14);c.fill();
  c.fillStyle='#ffd166';c.beginPath();c.moveTo(-10,-8);c.lineTo(-10,-95);c.lineTo(-52,-14);c.fill();c.restore();
}
function birds(c,t,a,ox=0,oy=0){
  if(a<=0)return;c.strokeStyle=`rgba(40,40,70,${.75*a})`;c.lineWidth=3;c.lineCap='round';
  for(let i=0;i<7;i++){const x=ox+((rnd(i)*800+t*90+i*70)%2600)-400,y=oy+180+rnd(i*5)*160+Math.sin(t+i)*10,f=Math.sin(t*9+i*2)*8,s=10+rnd(i*9)*6;
    c.beginPath();c.moveTo(x-s,y-f);c.quadraticCurveTo(x-s*.4,y-2,x,y+2);c.quadraticCurveTo(x+s*.4,y-2,x+s,y-f);c.stroke();}
}
const FLOWERS=[];for(let i=0;i<46;i++){const l=i%3,x=[1180,1500,1150][l]+rnd(i*13)*[900,950,620][l];FLOWERS.push([x,l,['#ff6fa3','#ffd166','#9b7bff','#ff8f5a','#ffffff','#5ad1ff'][i%6],rnd(i*17)])}
function drawLand(c,t,o){
  // sun & rainbow behind mountains
  if(o.sun>0){const sy=lerp(HZ+120,o.sunY??300,E.out(o.sun));glow(c,1240,sy,330,'#ffe9a8',.75);c.fillStyle='#fff3c2';c.beginPath();c.arc(1240,sy,72,0,TAU);c.fill();
    c.save();c.translate(1240,sy);c.rotate(t*.12);c.fillStyle='rgba(255,240,190,.18)';for(let i=0;i<12;i++){c.rotate(TAU/12);c.beginPath();c.moveTo(0,0);c.lineTo(-40,-560);c.lineTo(40,-560);c.fill()}c.restore();}
  if(o.rainbow>0){const cols=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#748ffc','#b197fc'];c.save();c.globalAlpha=.55*Math.min(1,o.rainbow*1.5);c.lineWidth=18;
    for(let i=0;i<7;i++){c.strokeStyle=cols[i];c.beginPath();c.arc(980,HZ+40,640-i*18,Math.PI,Math.PI+Math.PI*E.inOut(o.rainbow));c.stroke()}c.restore();}
  if(o.balloons>0){const B=[[420,['#ff6b6b','#ffd166']],[1500,['#5ad1ff','#ffffff']],[760,['#9b7bff','#ff9ec4']]];
    B.forEach((b,i)=>{const k=clamp(o.balloons*1.4-i*.2);if(k>0)drawBalloon(c,b[0]+Math.sin(t*.5+i)*20,lerp(HZ+40,230+i*70,E.out(k))-(t*6%40),.9-i*.15,b[1],t)});}
  // castle floats above the range in the finale
  if(o.castle>0)drawCastle(c,t,980,330,.55,1,o.castle,1);
  // mountains
  const m=o.mount;
  MOUNT2.forEach((p,i)=>drawPeak(c,p[0],p[1],p[2],E.back(clamp((m-.1-i*.05)/.6)),wk('#a9a3e6',clamp(m*1.5-.4)),wk('#8f86d4',clamp(m*1.5-.4))));
  MOUNT.forEach((p,i)=>{const d=Math.abs(p[0]-960)/1500;drawPeak(c,p[0],p[1],p[2],E.back(clamp((m-d*.35)/.55)),wk('#7f95e0',clamp(m*1.5-.45)),wk('#5466b4',clamp(m*1.5-.45)),wk('#ffffff',1))});
  // sea
  const sr=E.back(clamp(o.sea/.6)),sc=clamp((o.sea-.25)/.75);
  if(o.sea>0){const SC=['#7cc6f2','#4aa3e3','#2f7fcf','#1f5fae'];
    for(let L=0;L<4;L++){const by=HZ+L*58+(1-sr)*650,A=9+L*4;c.fillStyle=wk(SC[L],sc);c.beginPath();c.moveTo(-800,1500);
      for(let x=-800;x<=2800;x+=40)c.lineTo(x,by+A*Math.sin(x*.01+t*(1+L*.35)+L)+A*.5*Math.sin(x*.023-t*1.7+L*2));
      c.lineTo(2800,1500);c.fill();
      if(L>0&&sc>0){c.strokeStyle=`rgba(255,255,255,${.35*sc})`;c.lineWidth=3;c.setLineDash([26,40]);c.lineDashOffset=-t*40*(L+1);c.stroke();c.setLineDash([])}}

  const th=-Math.PI/2-.55+(t-52)*.26,R=1100,cx=960,cy=1520;
  const sx=cx+Math.cos(th)*R,sy=cy+Math.sin(th)*R;glow(c,sx,sy,360,mixh('#fff2b0','#ff9a6b',dusk),.8);c.fillStyle=mixh('#fff6cf','#ffb07a',dusk);c.beginPath();c.arc(sx,sy,82,0,TAU);c.fill();
  const mth=th-1.95,mx=cx+Math.cos(mth)*R,my=cy+Math.sin(mth)*R;glow(c,mx,my,260,'#cfd8ff',.45*night+.1);c.fillStyle='#f4f1ff';c.beginPath();c.arc(mx,my,64,0,TAU);c.fill();
  c.fillStyle=mixh('#f4f1ff','#1b1d55',1);c.beginPath();c.arc(mx+26,my-14,58,0,TAU);c.globalAlpha=.0;c.fill();c.globalAlpha=1;
  const dk=k=>Math.max(dusk*.4,night)*k;
  // far castle silhouette on the hill: the dream is still there
  c.save();c.globalAlpha=.85-.5*night;drawCastle(c,t,560-(t-52)*10,730,.28,1,1,false);c.restore();
  hillsLayer(c,t,760,40,.004,40,mixh('#8fd3a8','#3b3a7a',dk(1)),1);
  hillsLayer(c,t,860,46,.005,110,mixh('#5fc28a','#2a2862',dk(1)),2,[mixh('#3fa96b','#1f1e4d',dk(1)),mixh('#8a5a33','#1a1940',dk(1))]);
  hillsLayer(c,t,980,40,.006,260,mixh('#3fae6f','#1b1a46',dk(1)),3);
  popWord(c,t,['飞','吧','!'],560,240,140,[52.3,52.5,52.62],53.75,{fill:['#ffe066','#ff9ec4','#fff'],rot:-.12,beat:1});
  popWord(c,t,['飞','吧','!'],1360,200,140,[52.86,53.06,53.18],53.95,{fill:['#9be7ff','#b8f2a6','#fff'],rot:.1,beat:1});
  if(t>56.8){const p=planeState(t);for(let i=0;i<16;i++){const t0=56.85+i*.13;if(t<t0)continue;const q=(t-t0)/1.8;if(q>1)continue;
    const x=p.x-60+Math.sin(q*6+i)*40-q*200,y=p.y-40-q*420;c.globalAlpha=(1-q);c.fillStyle=['#ffe066','#ff9ec4','#9be7ff','#b8f2a6'][i%4];note(c,x,y,1.1+.2*Math.sin(i),i%2)}c.globalAlpha=1;
    popWord(c,t,['啦','啦','啦'],960,220,150,[57.0,57.55,58.1],58.75,{fill:['#ffe066','#ff9ec4','#9be7ff'],bounce:1,gap:1.6,beat:1});}
}
function note(c,x,y,s,dbl){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.ellipse(0,0,13,9,-.4,0,TAU);c.fill();c.fillRect(9,-46,4,46);
  if(dbl){c.beginPath();c.ellipse(34,-8,13,9,-.4,0,TAU);c.fill();c.fillRect(43,-54,4,46);c.beginPath();c.moveTo(9,-46);c.lineTo(47,-54);c.lineTo(47,-44);c.lineTo(9,-36);c.fill()}
  else{c.beginPath();c.moveTo(13,-46);c.quadraticCurveTo(30,-36,24,-18);c.quadraticCurveTo(26,-32,13,-34);c.fill()}c.restore()}

/* G · 风与流星: wind ribbons, dream wings, meteor shower */
function sceneG(c,t){
  drawSky(c,t,['#060924','#141a4e','#2d2470']);stars(c,t,260,1,9);
  for(let k=0;k<2;k++){c.save();c.globalAlpha=.22;const g=c.createLinearGradient(0,80,0,460);g.addColorStop(0,'rgba(120,255,200,0)');g.addColorStop(.5,k?'#b28bff':'#6dffc8');g.addColorStop(1,'rgba(120,255,200,0)');c.fillStyle=g;c.beginPath();
    for(let x=0;x<=W;x+=40)c.lineTo(x,160+k*90+Math.sin(x*.004+t*.6+k*2)*70);for(let x=W;x>=0;x-=40)c.lineTo(x,380+k*90+Math.sin(x*.004+t*.6+k*2+.6)*70);c.fill();c.restore()}
  glow(c,1520,220,300,'#dfe4ff',.4);c.fillStyle='#f6f3ff';c.beginPath();c.arc(1520,220,105,0,TAU);c.fill();c.fillStyle='#e0dbf5';[[-30,-20,20],[28,18,14],[-10,40,10],[40,-30,9]].forEach(([x,y,r])=>{c.beginPath();c.arc(1520+x,220+y,r,0,TAU);c.fill()});
  // meteors
  for(let i=0;i<20;i++){const t0=62.6+rnd(i*3)*2.4,q=(t-t0)/.9;if(q<0||q>1)continue;const x0=600+rnd(i)*1800,y0=-60+rnd(i*5)*300,x=x0-q*1500,y=y0+q*820,L=320;
    const g=c.createLinearGradient(x,y,x+L*.88,y-L*.48);g.addColorStop(0,'#ffffff');g.addColorStop(1,'rgba(160,200,255,0)');c.strokeStyle=g;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(x+L*.88,y-L*.48);c.stroke();glow(c,x,y,22,'#ffffff',.8)}
  const hq=inv(63.6,64.8,t);if(hq>0&&hq<1){const x=lerp(2100,-300,hq),y=lerp(40,700,hq);const g=c.createLinearGradient(x,y,x+700,y-190);g.addColorStop(0,'#fff6c9');g.addColorStop(1,'rgba(255,200,255,0)');c.strokeStyle=g;c.lineWidth=12;c.beginPath();c.moveTo(x,y);c.lineTo(x+700,y-190);c.stroke();glow(c,x,y,90,'#fff3c4',.9);
    for(let i=0;i<20;i++){const d=rnd(i)*500,px=x+d*.96+Math.sin(i)*20,py=y-d*.26+rnd(i*3)*40-20;c.globalAlpha=(1-d/500);c.fillStyle='#fff';starShape(c,px,py,6,2)}c.globalAlpha=1}
  const wind=inv(58.9,59.3,t);
  hillsLayer(c,t,840,40,.004,30,'#1e1f5a',4);hillsLayer(c,t,960,30,.005,80,'#141446',5);
  // grass in the wind
  c.strokeStyle='#2c2d74';c.lineWidth=4;c.lineCap='round';for(let i=0;i<90;i++){const x=i*22+rnd(i)*10,y=1000+Math.sin(x*.005+t*.08*80*.005)*30,sway=Math.sin(t*3+i*.4)*(6+14*wind)+12*wind;c.beginPath();c.moveTo(x,y+30);c.quadraticCurveTo(x+sway*.4,y,x+sway,y-30-rnd(i*3)*20);c.stroke()}
  // wind ribbons
  for(let r=0;r<6;r++){const t0=59.0+r*.28+(r>3?1.2:0),head=(t-t0)*1250-200;if(head<-200||head-900>W+200)continue;
    const y0=260+r*110,amp=40+r*8;c.lineCap='round';for(let s=0;s<30;s++){const x1=head-900+s*30,x2=x1+30;if(x2<0||x1>W)continue;const k=s/30;
      c.strokeStyle=`rgba(${r%2?'180,240,255':'255,235,250'},${k*.75})`;c.lineWidth=2+k*7;c.beginPath();c.moveTo(x1,y0+Math.sin(x1*.006+r+t)*amp);c.lineTo(x2,y0+Math.sin(x2*.006+r+t)*amp);c.stroke()}}
}

/* H · 穿越时空 → 回到梦想的地方 */
function sceneH(c,t){
  if(t<67.45){
    const w=inv(65.0,67.3,t);c.fillStyle='#0a0620';c.fillRect(0,0,W,H);glow(c,960,540,700,`#6b3cff`,.5+.3*w);
    for(let i=0;i<300;i++){const a=rnd(i)*TAU,sp=.35+rnd(i*3)*.65,ph=((t*sp*(1+w*2.5))+rnd(i*7))%1,d=Math.pow(ph,2.6)*1300,L=10+d*.25*(1+w*2);
      c.strokeStyle=`hsla(${(i*13+t*120)%360},90%,75%,${ph})`;c.lineWidth=1+ph*4;c.beginPath();c.moveTo(960+Math.cos(a)*d,540+Math.sin(a)*d);c.lineTo(960+Math.cos(a)*(d+L),540+Math.sin(a)*(d+L));c.stroke()}
    for(let k=0;k<6;k++){const ph=((t*.9+k/6)%1),r=Math.pow(ph,2)*1300;c.strokeStyle=`rgba(255,220,255,${ph*.6})`;c.lineWidth=2+ph*6;c.beginPath();c.arc(960,540,r,0,TAU);c.stroke();
      for(let m=0;m<12;m++){const a=m/12*TAU;c.beginPath();c.moveTo(960+Math.cos(a)*r*.92,540+Math.sin(a)*r*.92);c.lineTo(960+Math.cos(a)*r,540+Math.sin(a)*r);c.stroke()}}
    c.save();c.translate(960,540);c.globalAlpha=.55;c.strokeStyle='#fff';c.lineCap='round';c.lineWidth=10;c.rotate(t*9);c.beginPath();c.moveTo(0,0);c.lineTo(0,-240);c.stroke();c.lineWidth=14;c.rotate(-t*7.5);c.beginPath();c.moveTo(0,0);c.lineTo(0,-150);c.stroke();c.restore();
    return;
  }
  drawSky(c,t);const k=camH(t);c.save();applyCam(c,k);
  drawLand(c,t,{sea:1,mount:1,desert:1,bloom:1,rainbow:inv(68,70,t),sun:1,sunY:lerp(330,560,inv(67.4,77,t)),balloons:1,boat:1,birds:1,castle:1});
  c.restore();
  trail(c,t,.9,26,18,['#fff3a6','#ffffff'],inv(68,69,t)*.7);
  // fireworks
  [[72.0,520,260,'#ff9ec4'],[72.7,1420,220,'#ffe066'],[73.4,820,170,'#9be7ff'],[74.1,1200,300,'#b8f2a6'],[74.8,600,200,'#ffc078']].forEach(([ft,x,y,col],j)=>{const q=inv(ft,ft+1.6,t);if(q<=0||q>=1)return;
    for(let i=0;i<28;i++){const a=i/28*TAU,d=E.out(q)*170,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d+q*q*60;c.globalAlpha=1-q;c.fillStyle=col;starShape(c,px,py,7,2.5,4,a);c.globalAlpha=(1-q)*.4;c.fillRect(px-1,py-d*.25,2,d*.25)}
    glow(c,x,y,120*(1-q),col,.5*(1-q));c.globalAlpha=1});
}
function sceneHfg(c,t){
  if(t<71)return;const o=inv(71.3,72.3,t);c.save();c.globalAlpha=o*(1-inv(75.6,76.6,t));
  const g=c.createLinearGradient(0,620,0,H);g.addColorStop(0,'rgba(40,20,70,0)');g.addColorStop(1,'rgba(40,20,70,.55)');c.fillStyle=g;c.fillRect(0,620,W,H-620);c.restore();
  popWord(c,t,'开心往前飞'.split(''),960,820,140,[71.4,71.55,71.7,71.85,72.0],75.9,{fill:['#ffe066','#ff9ec4','#9be7ff','#b8f2a6','#ffc078'],beat:.6});
  c.globalAlpha=inv(72.6,73.4,t)*(1-inv(75.6,76.4,t));c.font='38px KL';c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText('— 回到梦想的地方 —',960,940);c.globalAlpha=1;
}

/* ---------- subtitles ---------- */
function drawSubs(c,t){
  let band=0;
  for(let i=0;i<LYRICS.length;i++){const [s,e,txt]=LYRICS[i],next=LYRICS[i+1],end=Math.min(next?next[0]-.12:99,e+1.6);
    const a=inv(s-.3,s-.05,t)*(1-inv(end-.2,end,t));if(a>0)band=Math.max(band,a);}
  if(band>0){const g=c.createLinearGradient(0,880,0,H);g.addColorStop(0,'rgba(10,8,30,0)');g.addColorStop(1,`rgba(10,8,30,${.5*band})`);c.fillStyle=g;c.fillRect(0,880,W,200);}
  for(let i=0;i<LYRICS.length;i++){const [s,e,txt]=LYRICS[i],next=LYRICS[i+1],end=Math.min(next?next[0]-.12:99,e+1.6);
    const a=inv(s-.3,s-.05,t)*(1-inv(end-.2,end,t));if(a<=0)continue;
    const ch=[...txt],n=ch.length,size=68,gap=size*1.04,prog=(t-s)/(e-s)*n,x0=960-(n-1)*gap/2,y=1000+(1-a)*14;
    c.save();c.globalAlpha=a;c.font=`${size}px KL`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
    ch.forEach((chr,j)=>{const sung=clamp(prog-j),hop=Math.sin(Math.PI*clamp((prog-j)*1.6))*10,x=x0+j*gap,yy=y-hop;
      c.lineWidth=12;c.strokeStyle='rgba(25,12,55,.75)';c.strokeText(chr,x,yy);
      c.fillStyle='#ffffff';c.fillText(chr,x,yy);
      if(sung>0){c.save();c.beginPath();c.rect(x-gap/2,yy-size,gap*sung,size*2);c.clip();const gg=c.createLinearGradient(0,yy-size/2,0,yy+size/2);gg.addColorStop(0,'#fff27a');gg.addColorStop(1,'#ffa94d');c.fillStyle=gg;c.fillText(chr,x,yy);c.restore()}});
    c.restore();}
}

/* ---------- compositor ---------- */
const SCENES=[
 {s:0,e:17.9,bg:sceneA},
 {s:17.3,e:34.5,bg:sceneB,fg:sceneBfg},
 {s:33.7,e:40.05,bg:sceneC},
 {s:40.0,e:46.15,bg:sceneD,fg:sceneDfg},
 {s:45.95,e:52.6,bg:sceneE,fg:sceneEfg},
 {s:52.1,e:59.3,bg:sceneF},
 {s:58.5,e:65.9,bg:sceneG},
 {s:65.2,e:77.5,bg:sceneH,fg:sceneHfg}];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const bctx=buf.getContext('2d');
let VIG=null;
function render(t){
  const c=ctx;c.setTransform(1,1e-9,0,1,0,0);c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;
  const act=SCENES.filter(s=>t>=s.s&&t<s.e);
  act.forEach((s,i)=>{if(i==0){s.bg(c,t)}else{bctx.setTransform(1,0,0,1,0,0);bctx.globalAlpha=1;bctx.clearRect(0,0,W,H);s.bg(bctx,t);c.globalAlpha=E.sine(inv(s.s,act[0].e,t));c.drawImage(buf,0,0);c.globalAlpha=1}});
  if(t>=17.3&&t<17.9){}
  const p=planeState(t);drawPlane(c,p,t);
  act.forEach((s,i)=>{if(!s.fg)return;c.save();if(i>0)c.globalAlpha=E.sine(inv(s.s,act[0].e,t));s.fg(c,t);c.restore()});
  // flashes
  const fl=Math.max(bump(26.2,26.32,26.4,26.8,t)*.7,bump(39.8,39.98,40.05,40.4,t),bump(67.15,67.42,67.5,68.1,t),
    [23.42,24.18,24.96,25.62].reduce((m,lt)=>Math.max(m,bump(lt,lt+.03,lt+.06,lt+.22,t)*.35),0));
  if(fl>0){c.fillStyle=`rgba(255,253,240,${fl})`;c.fillRect(0,0,W,H)}
  drawSubs(c,t);
  if(!VIG){VIG=c.createRadialGradient(960,540,420,960,540,1180);VIG.addColorStop(0,'rgba(0,0,20,0)');VIG.addColorStop(1,'rgba(0,0,20,.42)')}
  c.fillStyle=VIG;c.fillRect(0,0,W,H);
  const blk=Math.max(1-inv(0,.9,t),inv(75.9,77,t));if(blk>0){c.fillStyle=`rgba(0,0,0,${blk})`;c.fillRect(0,0,W,H)}
}

/* ---------- player ---------- */
const params=new URLSearchParams(location.search);
const RENDER=params.has('render');
window.renderAt=t=>render(t);
const ready=document.fonts.load('60px KL').then(()=>document.fonts.ready);
window.mvReady=ready;
if(RENDER){document.body.classList.add('render');ready.then(()=>render(+params.get('t')||0))}
else{
  const audio=new Audio(AUDIO_SRC);audio.preload='auto';
  const cover=document.getElementById('cover'),bar=document.getElementById('bar'),seek=document.getElementById('seek'),pp=document.getElementById('pp'),tm=document.getElementById('time');
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  let started=false,dragging=false;
  ready.then(()=>render(+params.get('t')||14.6));
  function start(){started=true;cover.classList.add('hide');audio.play();loop()}
  cover.addEventListener('click',start);
  pp.onclick=()=>{audio.paused?audio.play():audio.pause()};
  audio.onplay=()=>pp.textContent='❚❚';audio.onpause=()=>pp.textContent='▶';
  audio.onended=()=>{pp.textContent='↺';render(DURATION-.01)};
  seek.oninput=()=>{dragging=true;audio.currentTime=+seek.value;render(+seek.value)};seek.onchange=()=>dragging=false;
  let idle;const wake=()=>{bar.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>bar.classList.add('idle'),2200)};
  addEventListener('mousemove',wake);addEventListener('touchstart',wake);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();started?pp.onclick():start()}});
  function loop(){const t=audio.currentTime;render(Math.min(t,DURATION-.01));if(!dragging)seek.value=t;tm.textContent=`${fmt(t)} / ${fmt(DURATION)}`;requestAnimationFrame(loop)}
}
</script>
